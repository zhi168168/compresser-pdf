services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: compresser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: compresser_accounts
    volumes:
      - accounts_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compresser -d compresser_accounts"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://compresser:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/compresser_accounts
      ALLOW_INSECURE_LOCAL_DATABASE: "true"
      NODE_ENV: production
    command: ["node", "migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  accounts:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://compresser:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/compresser_accounts
      ALLOW_INSECURE_LOCAL_DATABASE: "true"
      NODE_ENV: production
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  accounts_db:
